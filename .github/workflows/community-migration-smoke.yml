name: Civil Rights Hub Community Migration Smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - supabase/migrations/20260828233500_reconcile_social_runtime_contract.sql
      - .github/workflows/community-migration-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-smoke:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/community-social-relaunch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Require Civil Rights Hub production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project ref"; exit 1; }

      - name: Apply reconciliation inside rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$(mktemp)"
          {
            printf '%s\n' 'BEGIN;'
            cat supabase/migrations/20260828233500_reconcile_social_runtime_contract.sql
            cat <<'SQL'

          DO $$
          DECLARE
            vote_function TEXT;
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint
              WHERE conrelid = 'public.poll_votes'::regclass
                AND conname = 'poll_votes_poll_id_fkey'
                AND pg_get_constraintdef(oid) LIKE '%REFERENCES posts(id)%'
            ) THEN
              RAISE EXCEPTION 'poll_votes FK does not reference posts(id)';
            END IF;

            SELECT pg_get_functiondef('public.enforce_post_poll_vote()'::regprocedure)
              INTO vote_function;
            IF position('FOR UPDATE' IN vote_function) = 0 THEN
              RAISE EXCEPTION 'poll vote validator does not serialize concurrent votes';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'protect_post_poll_data_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'post poll_data protection trigger missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'refresh_story_view_count_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'story view count trigger missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'protect_community_event_system_fields_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'event counter protection trigger missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'refresh_forum_thread_upvote_count_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'discussion upvote counter trigger missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'refresh_forum_thread_reply_stats_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'discussion reply counter trigger missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'protect_forum_thread_system_fields_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'discussion system-field protection trigger missing';
            END IF;

            IF has_function_privilege('anon', 'public.enforce_post_poll_vote()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.enforce_post_poll_vote()', 'EXECUTE')
               OR has_function_privilege('anon', 'public.refresh_post_poll_counts()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.refresh_post_poll_counts()', 'EXECUTE')
               OR has_function_privilege('anon', 'public.refresh_forum_thread_upvote_count()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.refresh_forum_thread_upvote_count()', 'EXECUTE')
               OR has_function_privilege('anon', 'public.refresh_forum_thread_reply_stats()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.refresh_forum_thread_reply_stats()', 'EXECUTE') THEN
              RAISE EXCEPTION 'server-maintained community helper is browser-executable';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname='storage' AND tablename='objects' AND policyname='avatars_auth_update'
            ) THEN
              RAISE EXCEPTION 'legacy avatar update policy still present';
            END IF;
          END $$;

          ROLLBACK;
          SQL
          } > "$sql_file"
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -f "$sql_file"
