name: Civil Rights Hub Community Production Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/community-production-audit.yml
      - src/pages/Community.tsx
      - src/components/SocialFeed.tsx
      - src/components/DiscussionBoard.tsx
      - src/components/StoriesBar.tsx
      - src/components/community/**
      - src/components/social/**
      - supabase/migrations/**
  push:
    branches: [main]
    paths:
      - .github/workflows/community-production-audit.yml
      - src/pages/Community.tsx
      - src/components/SocialFeed.tsx
      - src/components/DiscussionBoard.tsx
      - src/components/StoriesBar.tsx
      - src/components/community/**
      - src/components/social/**
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    # Production DB secrets are available only to same-repository PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Require Civil Rights Hub production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project ref"; exit 1; }

      - name: Audit current production social contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          SELECT version, name FROM supabase_migrations.schema_migrations
          WHERE version IN ('20260828220500','20260828233500') ORDER BY version;

          SELECT 'posts' AS table_name, count(*) AS rows FROM public.posts
          UNION ALL SELECT 'comments', count(*) FROM public.comments
          UNION ALL SELECT 'stories', count(*) FROM public.stories
          UNION ALL SELECT 'story_views', count(*) FROM public.story_views
          UNION ALL SELECT 'poll_votes', count(*) FROM public.poll_votes
          UNION ALL SELECT 'forum_threads', count(*) FROM public.forum_threads
          UNION ALL SELECT 'forum_posts', count(*) FROM public.forum_posts
          UNION ALL SELECT 'community_events', count(*) FROM public.community_events
          UNION ALL SELECT 'event_rsvps', count(*) FROM public.event_rsvps
          UNION ALL SELECT 'user_profiles', count(*) FROM public.user_profiles
          UNION ALL SELECT 'follows', count(*) FROM public.follows
          ORDER BY table_name;

          SELECT conrelid::regclass::text AS table_name, conname, pg_get_constraintdef(oid)
          FROM pg_constraint
          WHERE conrelid IN ('public.poll_votes'::regclass, 'public.post_polls'::regclass)
          ORDER BY table_name, conname;

          SELECT policyname, cmd, roles::text, qual, with_check
          FROM pg_policies
          WHERE (schemaname='public' AND tablename IN ('poll_votes','posts','stories','story_views','community_events','event_rsvps','user_profiles'))
             OR (schemaname='storage' AND tablename='objects' AND (coalesce(qual,'') ~ 'posts|avatars' OR coalesce(with_check,'') ~ 'posts|avatars'))
          ORDER BY schemaname, tablename, policyname;
          SQL

      - name: Rollback-test social runtime reconciliation
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$(mktemp)"
          {
            printf '%s\n' 'BEGIN;'
            cat supabase/migrations/20260828233500_reconcile_social_runtime_contract.sql
            cat <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.poll_votes'::regclass
                AND conname='poll_votes_poll_id_fkey'
                AND pg_get_constraintdef(oid) LIKE '%REFERENCES posts(id)%'
            ) THEN RAISE EXCEPTION 'poll_votes FK not reconciled'; END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='enforce_post_poll_vote_trigger' AND NOT tgisinternal)
            THEN RAISE EXCEPTION 'poll validation trigger missing'; END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='refresh_post_poll_counts_trigger' AND NOT tgisinternal)
            THEN RAISE EXCEPTION 'poll aggregate trigger missing'; END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='refresh_story_view_count_trigger' AND NOT tgisinternal)
            THEN RAISE EXCEPTION 'story view trigger missing'; END IF;

            IF has_table_privilege('anon','public.poll_votes','SELECT')
            THEN RAISE EXCEPTION 'anonymous poll vote ledger remains readable'; END IF;

            IF EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='storage' AND tablename='objects' AND policyname='avatars_auth_update')
            THEN RAISE EXCEPTION 'legacy avatar update policy remains'; END IF;
          END $$;
          ROLLBACK;
          SQL
          } > "$sql_file"
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -f "$sql_file"
