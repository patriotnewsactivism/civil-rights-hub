name: Civil Rights Hub Social Migration File Patch

on:
  push:
    branches: [fix/community-social-recovery]
    paths:
      - .github/workflows/community-recovery-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/community-social-recovery
          fetch-depth: 0

      - name: Apply reviewed migration corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260828220500_restore_clean_social_community.sql')
          text = migration.read_text()
          text = text.replace('poll_votes.post_id', 'poll_votes.poll_id')

          marker = "DELETE FROM public.community_events;\n"
          reset = (
              "\n-- Reset social-derived profile counters contaminated by the quarantined corpus.\n"
              "-- Keep relationship counts derived from surviving genuine follows rows.\n"
              "UPDATE public.user_profiles AS profile\n"
              "SET posts_created = 0,\n"
              "    posts_count = 0,\n"
              "    threads_created = 0,\n"
              "    helpful_answers = 0,\n"
              "    followers_count = (\n"
              "      SELECT COUNT(*)::integer FROM public.follows f WHERE f.following_id = profile.user_id\n"
              "    ),\n"
              "    following_count = (\n"
              "      SELECT COUNT(*)::integer FROM public.follows f WHERE f.follower_id = profile.user_id\n"
              "    );\n"
          )
          if 'posts_created = 0' not in text:
              if marker not in text:
                  raise SystemExit('Unable to locate social cleanup delete marker')
              text = text.replace(marker, marker + reset, 1)

          migration.write_text(text)
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q "poll_votes.poll_id" supabase/migrations/20260828220500_restore_clean_social_community.sql
          ! grep -q "poll_votes.post_id" supabase/migrations/20260828220500_restore_clean_social_community.sql
          grep -q "posts_created = 0" supabase/migrations/20260828220500_restore_clean_social_community.sql

      - name: Commit migration correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Civil Rights Hub Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260828220500_restore_clean_social_community.sql
          git commit -m "Harden clean social recovery migration"
          git push origin HEAD:fix/community-social-recovery
