name: Civil Rights Hub Legacy Civic Score Audit

on:
  push:
    branches: [fix/community-social-recovery]
    paths:
      - .github/workflows/community-recovery-autopatch.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verify target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project"; exit 1; }

      - name: Audit social-derived counters only
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          SELECT
            count(*) AS profiles,
            sum(coalesce(posts_created,0)) AS profile_posts_created,
            sum(coalesce(posts_count,0)) AS profile_posts_count,
            sum(coalesce(threads_created,0)) AS profile_threads_created,
            sum(coalesce(followers_count,0)) AS profile_followers_count,
            sum(coalesce(following_count,0)) AS profile_following_count
          FROM public.user_profiles;

          DO $$
          DECLARE result jsonb;
          BEGIN
            IF to_regclass('public.civic_scores') IS NOT NULL THEN
              EXECUTE $q$
                SELECT jsonb_build_object(
                  'rows', count(*),
                  'score', coalesce(sum(score),0),
                  'posts_count', coalesce(sum(posts_count),0),
                  'connections_count', coalesce(sum(connections_count),0)
                ) FROM public.civic_scores
              $q$ INTO result;
              RAISE NOTICE 'civic score aggregates: %', result;
            ELSE
              RAISE NOTICE 'civic_scores table absent';
            END IF;
          END $$;
          SQL
