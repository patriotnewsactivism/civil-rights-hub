name: Civil Rights Hub Sentry Dependency Bootstrap

on:
  push:
    branches: [fix/community-social-recovery]
    paths:
      - .github/workflows/community-recovery-autopatch.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/community-social-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Add Sentry React SDK
        run: npm install @sentry/react@latest --save

      - name: Verify dependency graph
        run: npm ls @sentry/react

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Civil Rights Hub Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Sentry dependency already current"
            exit 0
          fi
          git commit -m "Add Sentry React observability dependency"
          git push origin HEAD:fix/community-social-recovery
