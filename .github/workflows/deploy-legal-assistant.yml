name: Deploy Civil Rights Hub Legal Assistant

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/legal-assistant/**
      - .github/workflows/deploy-legal-assistant.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-legal-assistant-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm Civil Rights Hub project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy fail-closed legal assistant
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy legal-assistant --project-ref "$PROJECT_REF"

      - name: Verify deployed function is listed
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" | grep -F 'legal-assistant'
