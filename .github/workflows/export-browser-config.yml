name: Export Civil Rights Hub Browser Config

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/export-browser-config.yml

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'ops/netlify-social-recovery'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: vrdnrbjnitptxrexdlao
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Resolve browser-safe publishable key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 2; }
          response="$(curl -fsS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true")"
          publishable="$(printf '%s' "$response" | jq -r '([.[] | select(.type == "publishable" and (.disabled != true))][0].api_key // [.[] | select(.name == "anon" and (.disabled != true))][0].api_key // empty)')"
          test -n "$publishable" || { echo "::error::No enabled publishable/anon key returned"; exit 3; }
          echo "PUBLISHABLE_KEY=${publishable}"
