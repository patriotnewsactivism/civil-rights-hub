name: Inspect Remote August 24 Migrations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/inspect-20260824-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name != 'pull_request' || github.head_ref == 'ops/inspect-20260824-migrations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project"; exit 1; }
      - name: Dump remote-only migration ledger rows
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -Atc \
            "select row_to_json(m) from supabase_migrations.schema_migrations m where version in ('20260824055719','20260824055728','20260824064546','20260824070043','20260824070247','20260824070429') order by version"
