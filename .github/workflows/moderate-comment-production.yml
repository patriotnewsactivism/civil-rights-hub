name: Civil Rights Hub Comment Moderation Production

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/moderate-comment/**
      - .github/workflows/moderate-comment-production.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - supabase/functions/moderate-comment/**
      - .github/workflows/moderate-comment-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-moderate-comment-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  PROJECT_REF: vrdnrbjnitptxrexdlao

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check hardened function
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/moderate-comment/index.ts

      - name: Verify fail-closed authorization contract
        shell: bash
        run: |
          set -euo pipefail
          file=supabase/functions/moderate-comment/index.ts
          grep -q 'service.auth.getUser(token)' "$file"
          grep -q 'comment.user_id !== actor.id' "$file"
          grep -q 'comment_moderation_verdicts' "$file"
          grep -q 'Authentication required' "$file"
          if grep -q '"Access-Control-Allow-Origin": "\*"' "$file"; then
            echo "::error::moderate-comment restored wildcard CORS"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4

      - name: Require production function credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project ref"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy hardened moderate-comment function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy moderate-comment --project-ref "$PROJECT_REF"
