name: Apply Reviewed Enforcement Resource Seed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-apply-enforcement-resource-seed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-enforcement-resource-seed
  cancel-in-progress: false

env:
  PROJECT_REF: vrdnrbjnitptxrexdlao
  POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
  SEED_VERSION: "20260831060000"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify target and link production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao"
          test -f "supabase/migrations/${SEED_VERSION}_seed_verified_enforcement_and_litigation_resources.sql"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Refuse unexpected pending migrations
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' | grep -E '^[0-9]{14}$' | sort -u > /tmp/local
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" | sort -u > /tmp/remote
          comm -23 /tmp/local /tmp/remote > /tmp/pending
          cat > /tmp/allowed <<'EOF'
          20260803000000
          20260812190000
          20260822180500
          20260822210500
          20260822212000
          20260822213000
          20260822213500
          20260822214500
          20260822215000
          20260822215500
          20260822220000
          20260822220500
          20260822221000
          20260822223000
          20260823010000
          20260823010100
          20260823010200
          20260823010300
          20260823010400
          20260828220500
          20260828233500
          20260829030500
          20260830182000
          20260830182500
          20260830183000
          20260830183500
          20260830224500
          20260830225000
          20260831050000
          20260831053000
          20260831060000
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/allowed
          sort -u -o /tmp/allowed /tmp/allowed
          comm -23 /tmp/pending /tmp/allowed > /tmp/unreviewed
          echo 'Pending migrations:'
          cat /tmp/pending || true
          test ! -s /tmp/unreviewed || { echo '::error::Unreviewed pending migrations:'; cat /tmp/unreviewed; exit 2; }

      - name: Dry run and apply reviewed seed
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify source-backed publication contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE n integer;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20260831060000') THEN
              RAISE EXCEPTION 'seed migration missing from production ledger';
            END IF;
            SELECT count(DISTINCT r.external_url) INTO n
            FROM public.resource_library r
            WHERE r.external_url IN (
              'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title18-section241',
              'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=granuleid%3AUSC-prelim-title18-section242',
              'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A1983+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section1983%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A1985+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section1985%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A12132+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section12132%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=%28title%3A42+section%3A12203+edition%3Aprelim%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title29-section794',
              'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title5-section552%28b%29%283%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&hl=false&req=granuleid%3AUSC-prelim-title5-section552a',
              'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A28+section%3A1346+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title28-section1346%29',
              'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title28-section2675',
              'https://www.ecfr.gov/current/title-28/chapter-I/part-35',
              'https://www.justice.gov/oip/doj-guide-freedom-information-act-0',
              'https://www.archives.gov/ogis/mediation-program',
              'https://www.eeoc.gov/how-file-charge-employment-discrimination',
              'https://www.hhs.gov/ocr/complaints/index.html',
              'https://www.ed.gov/laws-and-policy/civil-rights-laws/file-complaint',
              'https://www.hud.gov/helping-americans/fair-housing-act-overview',
              'https://www.uscourts.gov/forms-rules/forms/fee-waiver-application-forms',
              'https://www.uscourts.gov/forms-rules/forms/application-proceed-district-court-without-prepaying-fees-or-costs-long-form',
              'https://www.uscourts.gov/forms-rules/forms/subpoena-produce-documents-information-or-objects-or-permit-inspection-premises-a-civil-action'
            )
              AND r.is_approved=true
              AND public.has_publishable_provenance('resource',r.id)
              AND public.provenance_supports_fields(
                'resource',r.id,
                ARRAY['title','description','resource_type','category','external_url','author','source']::text[]
              );
            IF n <> 21 THEN RAISE EXCEPTION 'expected 21 verified enforcement resources, found %',n; END IF;
          END $$;
          SQL

      - name: Verify anonymous visibility
        shell: bash
        run: |
          set -euo pipefail
          visible="$(psql "$POOLER_URL" -qAt -v ON_ERROR_STOP=1 <<'SQL' | tail -n1
          set role anon;
          select count(distinct external_url)
          from public.resource_library
          where external_url in (
            'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title18-section241',
            'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=granuleid%3AUSC-prelim-title18-section242',
            'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A1983+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section1983%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A1985+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section1985%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A42+section%3A12132+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title42-section12132%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=%28title%3A42+section%3A12203+edition%3Aprelim%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title29-section794',
            'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title5-section552%28b%29%283%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&hl=false&req=granuleid%3AUSC-prelim-title5-section552a',
            'https://uscode.house.gov/view.xhtml?edition=prelim&f=treesort&num=0&req=%28title%3A28+section%3A1346+edition%3Aprelim%29+OR+%28granuleid%3AUSC-prelim-title28-section1346%29',
            'https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title28-section2675',
            'https://www.ecfr.gov/current/title-28/chapter-I/part-35',
            'https://www.justice.gov/oip/doj-guide-freedom-information-act-0',
            'https://www.archives.gov/ogis/mediation-program',
            'https://www.eeoc.gov/how-file-charge-employment-discrimination',
            'https://www.hhs.gov/ocr/complaints/index.html',
            'https://www.ed.gov/laws-and-policy/civil-rights-laws/file-complaint',
            'https://www.hud.gov/helping-americans/fair-housing-act-overview',
            'https://www.uscourts.gov/forms-rules/forms/fee-waiver-application-forms',
            'https://www.uscourts.gov/forms-rules/forms/application-proceed-district-court-without-prepaying-fees-or-costs-long-form',
            'https://www.uscourts.gov/forms-rules/forms/subpoena-produce-documents-information-or-objects-or-permit-inspection-premises-a-civil-action'
          );
          SQL
          )"
          [[ "$visible" == "21" ]] || { echo "::error::anon sees ${visible}/21 seeded resources"; exit 3; }
          echo 'Verified: anon sees exactly 21 source-backed enforcement resources.'