name: Apply Reviewed Rights Resource Seed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-apply-rights-resource-seed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-reviewed-rights-seed
  cancel-in-progress: false

env:
  PROJECT_REF: vrdnrbjnitptxrexdlao
  POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
  SEED_VERSION: "20260831053000"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify target and link production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$PROJECT_REF" = 'vrdnrbjnitptxrexdlao'
          test -f "supabase/migrations/${SEED_VERSION}_seed_verified_rights_and_access_resources.sql"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Refuse unexpected pending migrations
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' | grep -E '^[0-9]{14}$' | sort -u > /tmp/local
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" | sort -u > /tmp/remote
          comm -23 /tmp/local /tmp/remote > /tmp/pending
          echo 'Pending:'; cat /tmp/pending || true
          bad="$(grep -v -x "$SEED_VERSION" /tmp/pending || true)"
          test -z "$bad" || { echo '::error::Unexpected pending migration(s):'; printf '%s\n' "$bad"; exit 2; }

      - name: Dry run and apply reviewed seed
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify source-backed publication contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE n integer;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20260831053000') THEN
              RAISE EXCEPTION 'rights seed missing from migration ledger';
            END IF;
            SELECT count(*) INTO n
            FROM public.resource_library r
            WHERE r.id::text LIKE 'e8f44f71-6c55-4ea4-a9dc-2000000000%'
              AND r.is_approved=true
              AND public.has_publishable_provenance('resource',r.id)
              AND public.provenance_supports_fields(
                'resource',r.id,
                ARRAY['title','description','resource_type','category','external_url','author','source']::text[]
              );
            IF n <> 17 THEN RAISE EXCEPTION 'expected 17 verified rights resources, found %',n; END IF;
          END $$;
          SQL

      - name: Verify anonymous visibility
        shell: bash
        run: |
          set -euo pipefail
          visible="$(psql "$POOLER_URL" -v ON_ERROR_STOP=1 -qAtc "set role anon; select count(*) from public.resource_library where id::text like 'e8f44f71-6c55-4ea4-a9dc-2000000000%';")"
          [[ "$visible" == '17' ]] || { echo "::error::anon sees ${visible}/17 rights resources"; exit 3; }
          echo 'Anonymous RLS exposes exactly 17 verified rights resources.'
