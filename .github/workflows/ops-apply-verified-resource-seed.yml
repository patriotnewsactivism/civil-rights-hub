name: Apply Verified Resource Seed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-apply-verified-resource-seed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-verified-resource-seed
  cancel-in-progress: false

env:
  PROJECT_REF: vrdnrbjnitptxrexdlao
  POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
  SEED_VERSION: "20260831050000"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require exact production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao"
          test -f "supabase/migrations/${SEED_VERSION}_seed_verified_primary_resources.sql"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production
        shell: bash
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Refuse any unreviewed pending migration
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' | grep -E '^[0-9]{14}$' | sort -u > /tmp/local
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" | sort -u > /tmp/remote
          comm -23 /tmp/local /tmp/remote > /tmp/pending
          cat > /tmp/allowed <<'EOF'
          20260803000000
          20260812190000
          20260822180500
          20260822210500
          20260822212000
          20260822213000
          20260822213500
          20260822214500
          20260822215000
          20260822215500
          20260822220000
          20260822220500
          20260822221000
          20260822223000
          20260823010000
          20260823010100
          20260823010200
          20260823010300
          20260823010400
          20260828220500
          20260828233500
          20260829030500
          20260830182000
          20260830182500
          20260830183000
          20260830183500
          20260830224500
          20260830225000
          20260831050000
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/allowed
          sort -u -o /tmp/allowed /tmp/allowed
          comm -23 /tmp/pending /tmp/allowed > /tmp/unreviewed
          echo 'Pending migrations:'
          cat /tmp/pending || true
          test ! -s /tmp/unreviewed || { echo '::error::Unreviewed pending migrations:'; cat /tmp/unreviewed; exit 2; }

      - name: Dry run
        shell: bash
        run: supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reviewed migrations
        shell: bash
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify 11 source-backed resources and migration ledger
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE
            urls text[] := ARRAY[
              'https://www.foia.gov/how-to.html',
              'https://www.uscourts.gov/forms-rules/current-rules-practice-procedure/federal-rules-civil-procedure',
              'https://www.uscourts.gov/forms-rules/current-rules-practice-procedure/federal-rules-appellate-procedure',
              'https://www.uscourts.gov/forms-rules/forms/civil-forms',
              'https://www.uscourts.gov/forms-rules/forms/complaint-a-civil-case',
              'https://pacer.uscourts.gov/',
              'https://civilrights.justice.gov/report/',
              'https://www.justice.gov/crt/publications',
              'https://www.ada.gov/assets/pdfs/title_ii_reg_update.pdf',
              'https://www.govinfo.gov/help/uscode',
              'https://www.govinfo.gov/content/pkg/GOVPUB-JU13-PURL-gpo54237/pdf/GOVPUB-JU13-PURL-gpo54237.pdf'
            ];
            n integer;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20260831050000') THEN
              RAISE EXCEPTION 'seed migration missing from production ledger';
            END IF;
            SELECT count(DISTINCT r.external_url) INTO n
            FROM public.resource_library r
            WHERE r.external_url = ANY(urls)
              AND r.is_approved = true
              AND public.has_publishable_provenance('resource',r.id)
              AND public.provenance_supports_fields(
                'resource',r.id,
                ARRAY['title','description','resource_type','category','external_url','author','source']::text[]
              );
            IF n <> 11 THEN RAISE EXCEPTION 'expected 11 publishable verified resources, found %', n; END IF;
            IF EXISTS (
              SELECT external_url FROM public.resource_library
              WHERE external_url = ANY(urls) AND is_approved=true
              GROUP BY external_url HAVING count(*) > 1
            ) THEN RAISE EXCEPTION 'approved duplicate verified-resource URL detected'; END IF;
          END $$;
          SQL

      - name: Verify anonymous RLS publication
        shell: bash
        run: |
          set -euo pipefail
          visible="$(psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc "set role anon; select count(*) from public.resource_library where title in ('How to Make a FOIA Request','Federal Rules of Civil Procedure','Federal Rules of Appellate Procedure','Federal Civil Court Forms','Complaint for a Civil Case — Pro Se 1','PACER — Federal Court Records','Report a Civil Rights Violation to the U.S. Department of Justice','DOJ Civil Rights Division Publications','ADA Title II Regulation — State and Local Government Services','United States Code on GovInfo','Section 1983 Litigation, Third Edition');")"
          [[ "$visible" == "11" ]] || { echo "::error::anon sees ${visible}/11 seeded resources"; exit 3; }
          echo 'Verified: anon sees exactly 11 source-backed resources.'
