name: Patch Social Runtime Hotspots

on:
  push:
    branches:
      - fix/social-feed-story-runtime
    paths:
      - .github/workflows/patch-social-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-feed-story-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python scripts/patch-social-runtime.py
      - run: npm run build

      - name: Commit runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Civil Rights Hub Runtime Fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/SocialFeed.tsx src/components/StoriesBar.tsx src/components/social/PollDisplay.tsx
          git diff --cached --check
          git commit -m "Fix feed poll and story runtime errors"
          git push origin HEAD:fix/social-feed-story-runtime
