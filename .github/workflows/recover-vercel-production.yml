name: Recover Civil Rights Hub Vercel Production

# Recovery retriggered 2026-08-29 after DEPLOYMENT_DISABLED was confirmed on civilrightshub.org.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-vercel-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-vercel-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_MCJ7KOlUUGWD5FooE8jLnAVBnoEN
      VERCEL_ORG_ID: team_diKz4fwe7feyi5yT7tYIkpwl
      VERCEL_SCOPE: donmatthews
      PRIMARY_DOMAIN: civilrightshub.org
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [[ -z "$token" ]]; then
            token="${VERCEL_TOKEN_ALT:-}"
          fi
          if [[ -z "$token" ]]; then
            echo "::error::Missing VERCEL_TOKEN (or VERCEL_ACCESS_TOKEN) repository secret."
            exit 2
          fi
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "::add-mask::$token"

      - name: Unpause only the Civil Rights Hub production project
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/vercel-unpause.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/unpause?teamId=${VERCEL_ORG_ID}")"
          if [[ "$status" != "200" && "$status" != "204" ]]; then
            echo "::error::Vercel unpause failed with HTTP ${status}."
            cat /tmp/vercel-unpause.json || true
            exit 3
          fi
          echo "Civil Rights Hub Vercel project unpaused."

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@latest

      - name: Pull production project settings
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          test "$(node -p "require('./.vercel/project.json').projectId")" = "$VERCEL_PROJECT_ID"
          test "$(node -p "require('./.vercel/project.json').orgId")" = "$VERCEL_ORG_ID"

      - name: Build current main with production settings
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy current main to production
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "Production deployment: $url"
          echo "RECOVERY_DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"

      - name: Verify production domain is no longer paused
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "https://${PRIMARY_DOMAIN}/?recovery=${GITHUB_SHA}")"
            if [[ "$status" == "200" ]] && ! grep -qi 'Deployment Paused' /tmp/home.html; then
              echo "Production domain is serving application HTML (HTTP 200)."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status}; waiting for alias propagation..."
            sleep 10
          done
          echo "::error::Production domain did not recover within the verification window."
          head -80 /tmp/home.html || true
          exit 4
