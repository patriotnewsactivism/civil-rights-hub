name: Civil Rights Hub Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - supabase/functions/**
      - .github/workflows/supabase-migrate-now.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - supabase/functions/**
      - .github/workflows/supabase-migrate-now.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-supabase-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  PROJECT_REF: vrdnrbjnitptxrexdlao
  POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Require production validation credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project ref"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm production project link
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Validate migration history and reviewed allowlist
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local_versions.txt

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            | sort -u > /tmp/remote_versions.txt

          comm -23 /tmp/local_versions.txt /tmp/remote_versions.txt > /tmp/pending_versions.txt
          echo "Pending migration versions:"
          cat /tmp/pending_versions.txt || true

          cat > /tmp/reviewed_pending_allowlist.txt <<'EOF'
          20260803000000
          20260812190000
          20260822180500
          20260822210500
          20260822212000
          20260822213000
          20260822213500
          20260822214500
          20260822215000
          20260822215500
          20260822220000
          20260822220500
          20260822221000
          20260822223000
          20260823010000
          20260823010100
          20260823010200
          20260823010300
          20260823010400
          20260828220500
          20260828233500
          20260829030500
          20260830182000
          20260830182500
          20260830183000
          20260830183500
          20260830224500
          20260830225000
          20260831050000
          20260831053000
          20260831060000
          20260831063000
          20260831070000
          20260831072000
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/reviewed_pending_allowlist.txt
          sort -u -o /tmp/reviewed_pending_allowlist.txt /tmp/reviewed_pending_allowlist.txt

          comm -23 /tmp/pending_versions.txt /tmp/reviewed_pending_allowlist.txt > /tmp/unexpected_pending.txt
          if [[ -s /tmp/unexpected_pending.txt ]]; then
            echo "::error::Unreviewed migrations are missing from production history:"
            cat /tmp/unexpected_pending.txt
            exit 2
          fi

          for version in 20260830182000 20260830182500 20260830183000 20260830183500 20260831070000 20260831072000; do
            if ! grep -qx "$version" /tmp/remote_versions.txt && ! grep -qx "$version" /tmp/pending_versions.txt; then
              echo "::error::Required production migration $version is neither deployed nor pending"
              exit 3
            fi
          done

      - name: Show linked migration dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Execute private incident migration against production schema and roll back
        shell: bash
        run: |
          set -euo pipefail
          if psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select 1 from supabase_migrations.schema_migrations where version = '20260831070000'" | grep -qx 1; then
            echo "Private incident migration is already deployed; skipping rollback preflight."
            exit 0
          fi

          preflight="$(mktemp)"
          printf '%s\n' 'BEGIN;' > "$preflight"
          sed -E '/^[[:space:]]*(BEGIN|COMMIT);[[:space:]]*$/Id' \
            supabase/migrations/20260831070000_private_incident_reporting_and_audited_moderation.sql >> "$preflight"
          cat >> "$preflight" <<'SQL'

          DO $$
          BEGIN
            IF to_regclass('public.incident_reports') IS NULL
               OR to_regclass('public.incident_report_evidence') IS NULL
               OR to_regclass('public.moderation_audit_log') IS NULL THEN
              RAISE EXCEPTION 'private incident/moderation tables missing during preflight';
            END IF;
            IF to_regprocedure('public.create_incident_report(text,text,timestamp with time zone,text,text,text,text,text,text,text,text,boolean)') IS NULL
               OR to_regprocedure('public.moderate_content_report(uuid,text,text)') IS NULL
               OR to_regprocedure('public.review_incident_report(uuid,text,text)') IS NULL THEN
              RAISE EXCEPTION 'private incident/moderation RPC contract incomplete';
            END IF;
            IF has_table_privilege('anon', 'public.incident_reports', 'SELECT')
               OR has_table_privilege('anon', 'public.incident_report_evidence', 'SELECT')
               OR has_table_privilege('anon', 'public.moderation_audit_log', 'SELECT') THEN
              RAISE EXCEPTION 'private incident/moderation data leaked to anonymous role';
            END IF;
            IF has_table_privilege('authenticated', 'public.incident_reports', 'INSERT')
               OR has_table_privilege('authenticated', 'public.incident_reports', 'UPDATE')
               OR has_table_privilege('authenticated', 'public.incident_reports', 'DELETE') THEN
              RAISE EXCEPTION 'incident report browser writes bypass server-authoritative RPCs';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.create_incident_report(text,text,timestamp with time zone,text,text,text,text,text,text,text,text,boolean)', 'EXECUTE')
               OR NOT has_function_privilege('authenticated', 'public.moderate_content_report(uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'required authenticated RPC execute grants are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM storage.buckets WHERE id = 'incident-evidence' AND public = false) THEN
              RAISE EXCEPTION 'private incident evidence bucket missing or public';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'storage' AND tablename = 'objects'
                AND policyname = 'incident_evidence_storage_owner_insert'
            ) THEN
              RAISE EXCEPTION 'incident evidence upload policy missing';
            END IF;
          END $$;

          ROLLBACK;
          SQL

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -f "$preflight"

      - name: Execute sensitive policy correction against production schema and roll back
        shell: bash
        run: |
          set -euo pipefail
          if psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select 1 from supabase_migrations.schema_migrations where version = '20260831072000'" | grep -qx 1; then
            echo "Sensitive policy correction is already deployed; skipping rollback preflight."
            exit 0
          fi

          preflight="$(mktemp)"
          printf '%s\n' 'BEGIN;' > "$preflight"
          sed -E '/^[[:space:]]*(BEGIN|COMMIT);[[:space:]]*$/Id' \
            supabase/migrations/20260831072000_canonicalize_sensitive_select_policies.sql >> "$preflight"
          cat >> "$preflight" <<'SQL'

          DO $$
          DECLARE
            bad text;
          BEGIN
            WITH browser_roles AS (
              SELECT oid, rolname FROM pg_roles WHERE rolname IN ('authenticated')
            ), actions(code, name) AS (
              VALUES ('r'::"char", 'select')
            ), collisions AS (
              SELECT n.nspname, c.relname, br.rolname, a.name, count(*) AS policy_count
              FROM pg_policy p
              JOIN pg_class c ON c.oid = p.polrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              CROSS JOIN browser_roles br
              CROSS JOIN actions a
              WHERE n.nspname = 'public'
                AND c.relname IN ('content_reports', 'incident_reports', 'incident_report_evidence')
                AND p.polpermissive = true
                AND p.polcmd IN ('*'::"char", a.code)
                AND (0::oid = ANY(p.polroles) OR br.oid = ANY(p.polroles))
              GROUP BY n.nspname, c.relname, br.rolname, a.name
              HAVING count(*) > 1
            )
            SELECT string_agg(format('%I.%I/%s/%s=%s', nspname, relname, rolname, name, policy_count), ', ')
            INTO bad
            FROM collisions;

            IF bad IS NOT NULL THEN
              RAISE EXCEPTION 'Sensitive permissive policy collisions remain: %', bad;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='content_reports'
                AND policyname='content_reports_owner_or_staff_select'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='incident_reports'
                AND policyname='incident_reports_owner_or_staff_select'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='incident_report_evidence'
                AND policyname='incident_evidence_owner_or_staff_select'
            ) THEN
              RAISE EXCEPTION 'Canonical sensitive owner/staff policies missing';
            END IF;
          END $$;

          ROLLBACK;
          SQL

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -f "$preflight"

      - name: Verify rollback left production unchanged
        shell: bash
        run: |
          set -euo pipefail
          if psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select 1 from supabase_migrations.schema_migrations where version = '20260831070000'" | grep -qx 1; then
            echo "private-incident-migration-deployed"
          else
            psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
              "select case when to_regclass('public.incident_reports') is null then 'clean' else 'unexpected-residue' end" \
              | grep -qx clean
          fi
          if psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select 1 from supabase_migrations.schema_migrations where version = '20260831072000'" | grep -qx 1; then
            echo "canonical-policy-migration-deployed"
          else
            test "$(psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_policies where schemaname='public' and policyname in ('content_reports_owner_or_staff_select','incident_reports_owner_or_staff_select','incident_evidence_owner_or_staff_select')")" = "0" || {
              echo "::error::Canonical policy preflight left production residue"
              exit 4
            }
          fi

      - name: Verify deployed community contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE
            deployed_count integer;
          BEGIN
            SELECT count(*) INTO deployed_count
            FROM supabase_migrations.schema_migrations
            WHERE version IN ('20260830182000','20260830182500','20260830183000','20260830183500');

            IF deployed_count = 4 THEN
              IF to_regclass('public.user_blocks') IS NULL
                 OR to_regclass('public.user_mutes') IS NULL
                 OR to_regclass('public.notification_preferences') IS NULL THEN
                RAISE EXCEPTION 'community privacy tables missing';
              END IF;
              IF to_regprocedure('public.get_or_create_direct_conversation(uuid)') IS NULL
                 OR to_regprocedure('public.create_group_conversation(text,uuid[])') IS NULL
                 OR to_regprocedure('public.send_conversation_message(uuid,text)') IS NULL
                 OR to_regprocedure('public.list_my_conversations(integer)') IS NULL
                 OR to_regprocedure('public.get_conversation_messages(uuid,integer,timestamp with time zone,uuid)') IS NULL THEN
                RAISE EXCEPTION 'community messaging RPC contract incomplete';
              END IF;
              IF has_table_privilege('anon', 'public.user_blocks', 'SELECT')
                 OR has_table_privilege('anon', 'public.user_mutes', 'SELECT')
                 OR has_table_privilege('anon', 'public.notification_preferences', 'SELECT') THEN
                RAISE EXCEPTION 'private community data is anonymous-readable';
              END IF;
              IF has_table_privilege('authenticated', 'public.conversation_messages', 'INSERT') THEN
                RAISE EXCEPTION 'direct browser message inserts remain enabled';
              END IF;
              IF NOT has_function_privilege('authenticated', 'public.send_conversation_message(uuid,text)', 'EXECUTE') THEN
                RAISE EXCEPTION 'message RPC unavailable';
              END IF;
              IF has_column_privilege('anon', 'public.user_profiles', 'message_permission', 'SELECT')
                 OR has_column_privilege('authenticated', 'public.user_profiles', 'message_permission', 'SELECT') THEN
                RAISE EXCEPTION 'community privacy preference is browser-readable';
              END IF;
            ELSE
              RAISE NOTICE 'Community foundation has %/4 migrations deployed; remaining versions are validated by dry-run.', deployed_count;
            END IF;
          END $$;
          SQL

  migrate-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4

      - name: Require production migration credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }
          test "$PROJECT_REF" = "vrdnrbjnitptxrexdlao" || { echo "::error::Unexpected Supabase project ref"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm project link
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Compare migration history and enforce reviewed allowlist
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local_versions.txt
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            | sort -u > /tmp/remote_versions.txt
          comm -23 /tmp/local_versions.txt /tmp/remote_versions.txt > /tmp/pending_versions.txt

          cat > /tmp/reviewed_pending_allowlist.txt <<'EOF'
          20260803000000
          20260812190000
          20260822180500
          20260822210500
          20260822212000
          20260822213000
          20260822213500
          20260822214500
          20260822215000
          20260822215500
          20260822220000
          20260822220500
          20260822221000
          20260822223000
          20260823010000
          20260823010100
          20260823010200
          20260823010300
          20260823010400
          20260828220500
          20260828233500
          20260829030500
          20260830182000
          20260830182500
          20260830183000
          20260830183500
          20260830224500
          20260830225000
          20260831050000
          20260831053000
          20260831060000
          20260831063000
          20260831070000
          20260831072000
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/reviewed_pending_allowlist.txt
          sort -u -o /tmp/reviewed_pending_allowlist.txt /tmp/reviewed_pending_allowlist.txt
          comm -23 /tmp/pending_versions.txt /tmp/reviewed_pending_allowlist.txt > /tmp/unexpected_pending.txt
          if [[ -s /tmp/unexpected_pending.txt ]]; then
            echo "::error::Unexpected historical migrations are missing from production history:"
            cat /tmp/unexpected_pending.txt
            exit 2
          fi

      - name: Show Supabase migration plan
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reviewed pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify community and private incident production foundation
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE
            deployed_count integer;
          BEGIN
            SELECT count(*) INTO deployed_count
            FROM supabase_migrations.schema_migrations
            WHERE version IN ('20260830182000','20260830182500','20260830183000','20260830183500');

            IF deployed_count <> 4 THEN
              RAISE EXCEPTION 'community production migrations missing from ledger: expected 4, found %', deployed_count;
            END IF;
            IF to_regclass('public.user_blocks') IS NULL
               OR to_regclass('public.user_mutes') IS NULL
               OR to_regclass('public.notification_preferences') IS NULL THEN
              RAISE EXCEPTION 'community privacy tables missing';
            END IF;
            IF to_regprocedure('public.get_or_create_direct_conversation(uuid)') IS NULL
               OR to_regprocedure('public.create_group_conversation(text,uuid[])') IS NULL
               OR to_regprocedure('public.send_conversation_message(uuid,text)') IS NULL
               OR to_regprocedure('public.list_my_conversations(integer)') IS NULL
               OR to_regprocedure('public.get_conversation_messages(uuid,integer,timestamp with time zone,uuid)') IS NULL THEN
              RAISE EXCEPTION 'community messaging RPC contract incomplete';
            END IF;
            IF has_table_privilege('anon', 'public.user_blocks', 'SELECT')
               OR has_table_privilege('anon', 'public.user_mutes', 'SELECT')
               OR has_table_privilege('anon', 'public.notification_preferences', 'SELECT') THEN
              RAISE EXCEPTION 'private community data is anonymous-readable';
            END IF;
            IF has_table_privilege('authenticated', 'public.conversation_messages', 'INSERT') THEN
              RAISE EXCEPTION 'direct browser message inserts remain enabled';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.send_conversation_message(uuid,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'message RPC unavailable';
            END IF;
            IF has_column_privilege('anon', 'public.user_profiles', 'message_permission', 'SELECT')
               OR has_column_privilege('authenticated', 'public.user_profiles', 'message_permission', 'SELECT') THEN
              RAISE EXCEPTION 'community privacy preference is browser-readable';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260831070000'
            ) THEN
              RAISE EXCEPTION 'private incident production migration missing from ledger';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260831072000'
            ) THEN
              RAISE EXCEPTION 'sensitive policy canonicalization migration missing from ledger';
            END IF;
            IF to_regclass('public.incident_reports') IS NULL
               OR to_regclass('public.incident_report_evidence') IS NULL
               OR to_regclass('public.moderation_audit_log') IS NULL THEN
              RAISE EXCEPTION 'private incident/moderation tables missing';
            END IF;
            IF has_table_privilege('anon', 'public.incident_reports', 'SELECT')
               OR has_table_privilege('authenticated', 'public.incident_reports', 'INSERT')
               OR has_table_privilege('authenticated', 'public.incident_reports', 'UPDATE') THEN
              RAISE EXCEPTION 'private incident privilege boundary is unsafe';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM storage.buckets WHERE id = 'incident-evidence' AND public = false) THEN
              RAISE EXCEPTION 'incident evidence bucket is missing or public';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='content_reports'
                AND policyname='content_reports_owner_or_staff_select'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='incident_reports'
                AND policyname='incident_reports_owner_or_staff_select'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='incident_report_evidence'
                AND policyname='incident_evidence_owner_or_staff_select'
            ) THEN
              RAISE EXCEPTION 'canonical sensitive owner/staff policies missing';
            END IF;
          END $$;
          SQL

      - name: Run rollback-only security smoke tests
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f supabase/tests/provenance_gate_smoke.sql
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_smoke.sql
          if [[ -f supabase/tests/private_incident_reporting_smoke.sql ]]; then
            psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f supabase/tests/private_incident_reporting_smoke.sql
          fi

      - name: Deploy fail-closed Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in case-search send-weekly-digest check-foia-deadlines send-foia-request track-foia-open legal-assistant upload-incident-evidence; do
            if [[ -d "$fn" ]]; then
              echo "Unexpected function path: $fn"
            fi
            if [[ -d "supabase/functions/$fn" ]]; then
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done

      - name: Enable leaked-password protection when supported
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/hibp-config.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"password_hibp_enabled":true}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")"
          if [[ "$status" == "200" ]]; then
            echo "Supabase leaked-password protection enabled."
          else
            echo "::warning::Could not enable leaked-password protection (HTTP ${status}); it may be plan-gated."
            cat /tmp/hibp-config.json
          fi

      - name: Run Supabase security and performance advisors
        shell: bash
        run: |
          set -euo pipefail
          for kind in security performance; do
            status="$(curl -sS -o "/tmp/${kind}.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/advisors/${kind}")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Supabase ${kind} advisor returned HTTP ${status}"
              cat "/tmp/${kind}.json"
              exit 1
            fi
            jq -r '(.lints // []) | group_by(.level) | map({level: .[0].level, count: length}) | .[] | "\(.level): \(.count)"' "/tmp/${kind}.json" || true
          done

      - name: Capture database security metadata
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select p.oid::regprocedure::text, p.prosecdef,
                   coalesce(array_to_string(p.proconfig, ','), ''),
                   has_function_privilege('anon', p.oid, 'EXECUTE'),
                   has_function_privilege('authenticated', p.oid, 'EXECUTE'),
                   has_function_privilege('service_role', p.oid, 'EXECUTE')
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' order by p.proname, p.oid;
          " > /tmp/function-security.tsv
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select schemaname, tablename, policyname, permissive, roles::text, cmd,
                   coalesce(qual, ''), coalesce(with_check, '')
            from pg_policies where schemaname = 'public'
            order by tablename, policyname;
          " > /tmp/rls-policies.tsv

      - name: Upload advisor and database audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-advisor-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/security.json
            /tmp/performance.json
            /tmp/function-security.tsv
            /tmp/rls-policies.tsv
            /tmp/hibp-config.json
