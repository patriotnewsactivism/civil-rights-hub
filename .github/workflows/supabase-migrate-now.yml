name: Civil Rights Hub Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-migrate-now.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-rights-hub-supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name != 'pull_request' || github.head_ref == 'ops/run-supabase-migrations'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: vrdnrbjnitptxrexdlao
      POOLER_URL: postgresql://postgres.vrdnrbjnitptxrexdlao@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require production migration credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm project link
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Compare migration history and enforce reviewed allowlist
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14}).*/\1/' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local_versions.txt

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            | sort -u > /tmp/remote_versions.txt

          comm -23 /tmp/local_versions.txt /tmp/remote_versions.txt > /tmp/pending_versions.txt

          echo "Pending migration versions:"
          cat /tmp/pending_versions.txt || true

          cat > /tmp/reviewed_pending_allowlist.txt <<'EOF'
          20260803000000
          20260812190000
          20260822180500
          20260822210500
          20260822212000
          20260822213000
          20260822213500
          20260822214500
          20260822215000
          20260822215500
          20260822220000
          20260822220500
          20260822221000
          20260822223000
          20260823010000
          20260823010100
          20260823010200
          20260823010300
          20260823010400
          20260828220500
          20260828233500
          20260829030500
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/reviewed_pending_allowlist.txt
          sort -u -o /tmp/reviewed_pending_allowlist.txt /tmp/reviewed_pending_allowlist.txt

          comm -23 /tmp/pending_versions.txt /tmp/reviewed_pending_allowlist.txt > /tmp/unexpected_pending.txt
          if [[ -s /tmp/unexpected_pending.txt ]]; then
            echo "::error::Unexpected historical migrations are missing from production history. Refusing to replay them automatically:"
            cat /tmp/unexpected_pending.txt
            exit 2
          fi

      - name: Inspect remote-only migration ledger entries
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -Atc \
            "select row_to_json(m) from supabase_migrations.schema_migrations m where version in ('20260803180000','20260803181500','20260803183000') order by version"

      - name: Show Supabase migration plan
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reviewed pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify social runtime contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20260828233500'
            ) THEN
              RAISE EXCEPTION 'social runtime migration missing from ledger';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.poll_votes'::regclass
                AND conname = 'poll_votes_poll_id_fkey'
                AND pg_get_constraintdef(oid) LIKE '%REFERENCES posts(id)%'
            ) THEN
              RAISE EXCEPTION 'poll_votes FK not reconciled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'refresh_story_view_count_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'story view trigger missing';
            END IF;
          END $$;
          SQL

      - name: Verify public-records reference hold
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM supabase_migrations.schema_migrations
              WHERE version = '20260829030500'
            ) THEN
              RAISE EXCEPTION 'public-records integrity migration missing from ledger';
            END IF;
            IF to_regclass('public.foia_agencies') IS NOT NULL THEN
              IF has_table_privilege('anon', 'public.foia_agencies', 'SELECT')
                 OR has_table_privilege('authenticated', 'public.foia_agencies', 'SELECT') THEN
                RAISE EXCEPTION 'unverified foia_agencies is browser-readable';
              END IF;
            END IF;
            IF to_regclass('public.foia_templates') IS NOT NULL THEN
              IF has_table_privilege('anon', 'public.foia_templates', 'SELECT')
                 OR has_table_privilege('authenticated', 'public.foia_templates', 'SELECT') THEN
                RAISE EXCEPTION 'unverified foia_templates is browser-readable';
              END IF;
            END IF;
          END $$;
          SQL

      - name: Run rollback-only provenance smoke tests
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f supabase/tests/provenance_gate_smoke.sql

      - name: Run rollback-only security hardening smoke tests
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_smoke.sql

      - name: Verify migration history after push
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy fail-closed Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy case-search --project-ref "$PROJECT_REF"
          supabase functions deploy send-weekly-digest --project-ref "$PROJECT_REF"
          supabase functions deploy check-foia-deadlines --project-ref "$PROJECT_REF"
          supabase functions deploy send-foia-request --project-ref "$PROJECT_REF"
          supabase functions deploy track-foia-open --project-ref "$PROJECT_REF"

      - name: Enable leaked-password protection
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/hibp-config.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"password_hibp_enabled":true}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")"

          if [[ "$status" == "200" ]]; then
            echo "Supabase leaked-password protection enabled."
          else
            echo "::warning::Could not enable leaked-password protection (HTTP ${status}). This feature can be plan-gated; preserving the exact response in the audit artifact."
            cat /tmp/hibp-config.json
          fi

      - name: Run Supabase security and performance advisors
        shell: bash
        run: |
          set -euo pipefail
          for kind in security performance; do
            echo "::group::Supabase ${kind} advisor"
            status="$(curl -sS -o "/tmp/${kind}.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/advisors/${kind}")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Supabase ${kind} advisor returned HTTP ${status}"
              cat "/tmp/${kind}.json"
              exit 1
            fi
            jq -r '(.lints // []) | group_by(.level) | map({level: .[0].level, count: length}) | .[] | "\(.level): \(.count)"' "/tmp/${kind}.json" || true
            jq -r '(.lints // []) | group_by(.name) | map({name: .[0].name, count: length}) | sort_by(-.count) | .[] | "\(.count)\t\(.name)"' "/tmp/${kind}.json" || true
            jq -r '(.lints // [])[] | [.level, .name, .title, .detail, .remediation] | @tsv' "/tmp/${kind}.json" | head -100 || true
            echo "::endgroup::"
          done

      - name: Capture database security metadata
        shell: bash
        run: |
          set -euo pipefail
          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select
              p.oid::regprocedure::text,
              p.prosecdef,
              coalesce(array_to_string(p.proconfig, ','), ''),
              has_function_privilege('anon', p.oid, 'EXECUTE'),
              has_function_privilege('authenticated', p.oid, 'EXECUTE'),
              has_function_privilege('service_role', p.oid, 'EXECUTE')
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
            order by p.proname, p.oid;
          " > /tmp/function-security.tsv

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select
              schemaname,
              tablename,
              policyname,
              permissive,
              roles::text,
              cmd,
              coalesce(qual, ''),
              coalesce(with_check, '')
            from pg_policies
            where schemaname = 'public'
            order by tablename, policyname;
          " > /tmp/rls-policies.tsv

          psql "$POOLER_URL" -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select r,
                   has_schema_privilege(r, 'public', 'USAGE'),
                   has_schema_privilege(r, 'public', 'CREATE')
            from unnest(array['anon','authenticated','service_role']) r;
          " > /tmp/public-schema-privileges.tsv

      - name: Upload full advisor and database audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-advisor-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/security.json
            /tmp/performance.json
            /tmp/function-security.tsv
            /tmp/rls-policies.tsv
            /tmp/public-schema-privileges.tsv
            /tmp/hibp-config.json
